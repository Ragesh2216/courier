<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Role Portal | SwiftCourier</title>
  <meta name="description" content="Sign in or register for SwiftCourier. Select your role as Client or Admin to access your personalized parcel tracking portal or fleet control tower.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background: radial-gradient(circle at top right, rgba(6, 182, 212, 0.2) 0%, transparent 60%), radial-gradient(circle at bottom left, rgba(245, 158, 11, 0.2) 0%, transparent 60%), #090d16; min-height: 100vh; display: flex; flex-direction: column;">

  <main class="auth-wrapper">
    <div class="auth-header">
      <a href="index.html" class="logo-brand" style="justify-content: center;">
        <img src="logo_0950.webp" alt="SwiftCourier Logo" class="brand-logo-img">
      </a>
      <p style="color: var(--text-muted); margin-top: 0.5rem;">Access Customer Portal or Fleet Operations Control Tower</p>
    </div>

    <div class="auth-card">
      <img src="assets/hero_delivery.webp" alt="SwiftCourier Portal Access" style="width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 1.5rem; border: 1px solid var(--border-glass);">
      
      <!-- Tab Switcher -->
      <div style="display: flex; background: rgba(0,0,0,0.4); border-radius: 8px; padding: 0.35rem; margin-bottom: 1.75rem;">
        <button class="auth-tab active" data-tab="login" style="flex: 1; padding: 0.65rem; background: var(--primary); color: #090d16; font-weight: 700; border-radius: 6px; cursor: pointer; border: none; transition: var(--transition);">Sign In</button>
        <button class="auth-tab" data-tab="register" style="flex: 1; padding: 0.65rem; background: transparent; color: var(--text-muted); font-weight: 700; border-radius: 6px; cursor: pointer; border: none; transition: var(--transition);">Register</button>
      </div>

      <!-- Quick Demo Direct Switchers -->
      <div style="background: rgba(245, 158, 11, 0.1); border: 1px dashed var(--primary); padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; text-align: center;">
        <p style="font-size: 0.85rem; color: var(--primary); font-weight: 700; margin-bottom: 0.5rem;">⚡ Instant Demo & Validation Tests:</p>
        <div style="display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap;">
         <a href="404.html" class="btn btn-outline btn-sm" style="color: var(--danger); border-color: rgba(239, 68, 68, 0.4);"><i class="fas fa-exclamation-triangle"></i> 404 Test</a>
        </div>
      </div>

      <!-- Auth Alert Banner (For Registration Success / Notifications) -->
      <div id="authAlert" style="display: none; background: rgba(52, 211, 153, 0.15); border: 1px solid #34d399; color: #34d399; padding: 0.85rem 1rem; border-radius: 8px; margin-bottom: 1.25rem; font-size: 0.9rem; text-align: center; align-items: center; justify-content: center; gap: 0.5rem;">
        <i class="fas fa-check-circle"></i> <span id="authAlertMsg">Registration successful! Please sign in with your credentials.</span>
      </div>

      <!-- Auth Form -->
      <form id="authForm">
        
        <!-- Role Selection -->
        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label class="form-label" style="color: #fff; font-weight: 700; margin-bottom: 0.5rem;">Select Role / Portal Destination:</label>
          <div class="auth-role-grid">
            
            <label class="auth-role-option">
              <input type="radio" name="userRole" value="client" checked>
              <div class="auth-role-info">
                <span class="auth-role-title">Customer / Client</span>
                <span class="auth-role-desc">Track & Book Parcels</span>
              </div>
            </label>

            <label class="auth-role-option">
              <input type="radio" name="userRole" value="admin">
              <div class="auth-role-info">
                <span class="auth-role-title">Admin / Operations</span>
                <span class="auth-role-desc">Dispatch & Analytics</span>
              </div>
            </label>

          </div>
        </div>

        <!-- Full Name (Hidden by default for login, visible for Register) -->
        <div class="form-group" id="fullNameGroup" style="display: none;">
          <label class="form-label">Full Name</label>
          <input type="text" id="authName" class="form-input" placeholder="e.g. John Doe">
        </div>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="authEmail" class="form-input" placeholder="user@swiftcourier.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="authPassword" class="form-input" placeholder="••••••••" required>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.85rem; flex-wrap: wrap; gap: 0.5rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; color: var(--text-muted); cursor: pointer;">
            <input type="checkbox" checked style="accent-color: var(--primary);"> Remember me
          </label>
          <a href="404.html" style="color: var(--primary);">Forgot Password?</a>
        </div>

        <button type="submit" id="authSubmitBtn" class="btn btn-primary btn-lg" style="width: 100%;">
          Sign In to Account
        </button>

      </form>

      <div style="margin-top: 1.5rem; text-align: center;">
        <a href="index.html" style="color: var(--text-muted); font-size: 0.85rem;"><i class="fas fa-arrow-left"></i> Back to Main Website</a>
      </div>

    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
